<h1>Your Ritual Basket</h1>

<div id="cart-items"></div>

<div id="cart-summary"></div>

<h3>Customer Details</h3>

<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">

<!-- 🔐 OTP SECTION -->
<div style="margin-top:8px;">

  <button id="sendOtpBtn" type="button">Send OTP</button>

  <div id="otpBox" style="display:none; margin-top:6px;">
    <input id="otp" placeholder="Enter OTP">
    <button id="verifyOtpBtn" type="button">Verify OTP</button>
  </div>

  <div id="otpStatus" style="font-size:12px; margin-top:4px;"></div>

</div>


<textarea id="address" placeholder="Address"></textarea>
<input 
  id="pincode" 
  placeholder="Pincode" 
  inputmode="numeric" 
  maxlength="6"
  oninput="this.value = this.value.replace(/\D/g, '').slice(0,6)"
>

<button onclick="openGuidelines()">Send Order on WhatsApp</button>

<!-- 1. Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<!-- 2. Your DB logic -->
<script src="/js/supabase-order.js"></script>

<!-- 3. Cart logic -->
<script src="/js/cart.js"></script>
<script src="/js/cart-ui.js"></script>
